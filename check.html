<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Install check - English Adventure</title>
<style>body{font-family:system-ui,sans-serif;background:#f7f8fe;color:#24213d;padding:22px;max-width:560px;margin:auto}h1{font-size:20px}li{margin:8px 0;line-height:1.5}.ok{color:#13865a}.bad{color:#b43d4a}code{background:#eceaf5;padding:2px 6px;border-radius:6px}button{border:0;border-radius:12px;background:#6558e8;color:#fff;padding:12px 16px;font-weight:700}</style></head>
<body><h1>Install check</h1><p>Ye page batata hai ki app install kyun nahi ho raha.</p><ul id="out"></ul><button onclick="location.reload()">Check again</button>
<script>
const out=document.getElementById('out');const add=(ok,t)=>{const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✅ ':'❌ ')+t;out.appendChild(li);};
(async()=>{
  add(location.protocol==='https:','Link https:// se shuru ho raha hai (abhi: '+location.protocol+')');
  const base=new URL('./',location.href).href;
  try{const r=await fetch(base+'manifest.json',{cache:'no-store'});add(r.ok,'manifest.json mil gaya (status '+r.status+')');
    const j=await r.json();
    for(const ic of j.icons){try{const x=await fetch(base+ic.src,{cache:'no-store'});add(x.ok,'Icon mila: '+ic.src+' (status '+x.status+')');}catch{add(false,'Icon nahi mila: '+ic.src);}}
  }catch(e){add(false,'manifest.json nahi mili ya galat hai: '+e.message);}
  try{const x=await fetch(base+'sw.js',{cache:'no-store'});add(x.ok,'sw.js mili (status '+x.status+')');}catch{add(false,'sw.js nahi mili');}
  add('serviceWorker' in navigator,'Browser offline support (service worker) sahi hai');
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();add(!!reg,'Service worker register hua (page dobara load karke dekhein)');}
  add(!!document.querySelector('link[rel=manifest]'),'index.html mein manifest link hai');
  const li=document.createElement('li');li.innerHTML='Sab ✅ hai par install nahi ho raha: Chrome mein <code>⋮ → Install app</code> dekhein; Android par app ko ek baar band karke dobara kholein.';out.appendChild(li);
})();
</script></body></html>
